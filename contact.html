<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNEC Events Hub - Contact</title>
    <!-- 1. Bootstrap CSS -->
    <link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet">
    <!-- 2. Font Awesome -->
    <link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- 3. YOUR CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="top">
        <h1>JNEC Events Hub</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <div class="container py-5">
            <!-- Page Title -->
            <h1 class="text-center mb-5" style="color: #0f172a;">📬 Contact Us</h1>

            <!-- Contact Info Cards -->
            <div class="row g-4 justify-content-center">
                <!-- Address -->
                <div class="col-md-6 col-lg-3">
                    <div class="card h-100 text-center shadow-sm border-0">
                        <div class="card-body">
                            <i class="fa-solid fa-location-dot fa-2x text-danger mb-3"></i>
                            <h5 class="card-title">Address</h5>
                            <p class="card-text text-muted small">Jigme Namgyel Engineering College, Dewathang, Bhutan</p>
                        </div>
                    </div>
                </div>
                <!-- Email -->
                <div class="col-md-6 col-lg-3">
                    <div class="card h-100 text-center shadow-sm border-0">
                        <div class="card-body">
                            <i class="fa-solid fa-envelope fa-2x text-primary mb-3"></i>
                            <h5 class="card-title">Email</h5>
                            <p class="card-text text-muted small">
                                <a href="mailto:05240130@jnec.edu.bt" class="text-decoration-none">05240130@jnec.edu.bt</a>
                            </p>
                        </div>
                    </div>
                </div>
                <!-- Phone -->
                <div class="col-md-6 col-lg-3">
                    <div class="card h-100 text-center shadow-sm border-0">
                        <div class="card-body">
                            <i class="fa-solid fa-phone fa-2x text-success mb-3"></i>
                            <h5 class="card-title">Phone</h5>
                            <p class="card-text text-muted small">+975 17319436</p>
                        </div>
                    </div>
                </div>
                <!-- Website -->
                <div class="col-md-6 col-lg-3">
                    <div class="card h-100 text-center shadow-sm border-0">
                        <div class="card-body">
                            <i class="fa-solid fa-globe fa-2x text-info mb-3"></i>
                            <h5 class="card-title">Website</h5>
                            <p class="card-text text-muted small">
                                <a href="https://www.jnec.edu.bt" target="_blank" class="text-decoration-none">www.jnec.edu.bt</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Map Section -->
            <h2 class="text-center mt-5 mb-4" style="color: #0f172a;">📍 Our Location</h2>
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="rounded shadow overflow-hidden">
                        <iframe 
                            src="https://www.google.com/maps?q=Jigme+Namgyel+Engineering+College&output=embed"
                            width="100%" 
                            height="400" 
                            style="border:0; display: block;" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>

            <!-- Enquiry Form -->
            <h2 class="text-center mt-5 mb-4" style="color: #0f172a;">✉️ Send us a Message</h2>
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <form>
                                <div class="mb-3">
                                    <label for="name" class="form-label fw-bold">Your Name</label>
                                    <input type="text" class="form-control" id="name" placeholder="Enter your name">
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-bold">Email Address</label>
                                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                                </div>
                                <div class="mb-3">
                                    <label for="message" class="form-label fw-bold">Message</label>
                                    <textarea class="form-control" id="message" rows="4" placeholder="Write your message here..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fa-solid fa-paper-plane"></i> Send Message
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 JNEC Events Hub</p>
    </footer>

    <script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
