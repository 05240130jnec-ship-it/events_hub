<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>JNEC Events Hub — Events</title> 
  <!-- 1. Bootstrap CSS -->
  <link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet"> 
  <!-- 2. Font Awesome -->
  <link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 
  <!-- 3. YOUR CSS -->
  <link rel="stylesheet" href="css/styles.css"> 
</head> 
<body> 
  <header id="top"> 
    <h1>JNEC Events Hub</h1> 
    <button type="button" id="darkToggle" class="btn btn-sm btn-outline-light">Dark mode</button>
    <nav> 
      <a href="index.html">Home</a> 
      <a href="events.html">Events</a> 
      <a href="register.html">Register</a> 
      <a href="gallery.html">Gallery</a> 
      <a href="contact.html">Contact</a> 
    </nav> 
  </header> 

  <main> 
    <div class="container py-4"> 
      <h2 class="mb-3">Upcoming Events</h2> 
      <div class="row g-2 mb-3"> 
          <div class="col-md-8"> 
          <label for="search" class="form-label">Search by title</label> 
          <input type="search" id="search" class="form-control" placeholder="e.g. 
Hackathon"> 
          </div> 
          <div class="col-md-4"> 
          <label for="seat-filter" class="form-label">Seats</label> 
          <select id="seat-filter" class="form-select"> 
          <option value="all">All events</option> 
          <option value="open">Open seats</option> 
          <option value="full">Sold out</option> 
          </select> 
          </div> 
    <div class="row g-3" id="eventList"></div>

      <!-- ===== FIXED TABLE ===== -->
      <h2 class="mt-5 mb-3">Tech Week Schedule</h2> 
      <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover"> 
          <caption class="fw-bold text-center">Tech Week 2026 Programme</caption> 
          <thead class="table-dark"> 
            <tr>
              <th style="width: 20%;">Time</th>
              <th style="width: 40%;">Monday</th>
              <th style="width: 40%;">Tuesday</th>
            </tr> 
          </thead> 
          <tbody> 
            <tr> 
              <td><strong>9:00</strong></td> 
              <td colspan="2">Opening Ceremony (both days)</td> 
            </tr> 
            <tr> 
              <td><strong>11:00</strong></td> 
              <td rowspan="2">Hackathon</td> 
              <td>Robotics Demo</td> 
            </tr> 
            <tr> 
              <td><strong>14:00</strong></td> 
              <td>Guest Talk</td> 
            </tr> 
          </tbody> 
        </table>
      </div>
    </div> 
  </main> 

  <footer> 
<p>&copy; <span id="year"></span> JNEC Events Hub</p> 
</footer> 
<script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script> 
<script src="js/main.js"></script> 
</body> 
</html>
