<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery for JNEC Events Hub - Home</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- 1. Bootstrap CSS (framework) -->
    <link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet">
    <!-- 2. Font Awesome (icons) -->
    <link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- 3. YOUR CSS last so you can override Bootstrap -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="top">
        <h1>JNEC Events Hub</h1>
        <nav>
            <a href="index.html" title="Go to home page">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <div class="container py-4">
            <!-- Gallery Section -->
            <h2 class="mb-4 text-center">Event Gallery</h2>
            <div class="row g-4">
                <!-- Image 1 -->
                <div class="col-md-4">
                    <img src="media/hackathon.jpg" alt="Hackathon" class="gallery-img img-fluid rounded shadow" data-bs-toggle="modal" data-bs-target="#imageModal1">
                    <p class="text-center mt-2 fw-bold">Hackathon 2025</p>
                </div>
                <!-- Image 2 -->
                <div class="col-md-4">
                    <img src="media/losar.jpg" alt="Losar Festival" class="gallery-img img-fluid rounded shadow" data-bs-toggle="modal" data-bs-target="#imageModal2">
                    <p class="text-center mt-2 fw-bold">Losar Festival</p>
                </div>
                <!-- Image 3 -->
                <div class="col-md-4">
                    <img src="media/football.jpg" alt="Football" class="gallery-img img-fluid rounded shadow" data-bs-toggle="modal" data-bs-target="#imageModal3">
                    <p class="text-center mt-2 fw-bold">Football Final</p>
                </div>
            </div>

            <!-- Highlights Video Section -->
            <h2 class="mt-5 mb-4 text-center"> Highlights Video</h2>
            <div class="row">
                <div class="col-md-8 mx-auto">
                    <video controls width="100%" poster="media/campus.jpg" class="rounded shadow">
                        <source src="media/Video.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>

            <!-- Campus Radio Jingle Section -->
            <h2 class="mt-5 mb-4 text-center"> Campus Radio Jingle</h2>
            <div class="row">
                <div class="col-md-6 mx-auto">
                    <div class="card p-4 shadow">
                        <audio controls class="w-100">
                            <source src="media/Audio.mpeg" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== IMAGE MODALS (Popup on Click) ===== -->

    <!-- Modal 1 -->
    <div class="modal fade" id="imageModal1" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" style="z-index: 1050;"></button>
                    <img src="media/hackathon.jpg" class="img-fluid rounded shadow-lg" style="max-height: 80vh; width: auto;" alt="Hackathon">
                    <p class="text-white mt-3 fw-bold fs-4">Hackathon 2025</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal 2 -->
    <div class="modal fade" id="imageModal2" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" style="z-index: 1050;"></button>
                    <img src="media/losar.jpg" class="img-fluid rounded shadow-lg" style="max-height: 80vh; width: auto;" alt="Losar Festival">
                    <p class="text-white mt-3 fw-bold fs-4">Losar Festival</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal 3 -->
    <div class="modal fade" id="imageModal3" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" style="z-index: 1050;"></button>
                    <img src="media/football.jpg" class="img-fluid rounded shadow-lg" style="max-height: 80vh; width: auto;" alt="Football">
                    <p class="text-white mt-3 fw-bold fs-4">Football Final</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 JNEC Events Hub</p>
    </footer>

    <!-- Bootstrap JS -->
    <script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
